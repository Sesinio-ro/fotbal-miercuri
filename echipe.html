<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>EchipeAi · Fotbal Miercuri</title>
<style>
:root{--bg:#0A1630;--panel:#12254A;--pitch:#0F2A55;--volt:#C6F432;--blue:#8DBBFF;--ink:#F2F5FA;--mut:#A9B8D4;--line:#3A5086;--dim:#2A3F6B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font-family:inherit;cursor:pointer;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:8px 12px;height:100vh;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.meta{font-size:12px;color:var(--mut);white-space:nowrap}
.test{display:none;font-size:11px;font-weight:700;color:var(--bg);background:var(--blue);border-radius:6px;padding:3px 8px;line-height:1.3}
.status{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;line-height:1.3;color:#D3DDF0}
.status i{width:7px;height:7px;border-radius:999px;background:var(--volt);flex-shrink:0}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:18px;font-size:15px;line-height:1.5}
.card b{display:block;font-size:17px;margin-bottom:4px}
#app{flex:1 1 auto;display:flex;flex-direction:column;gap:6px}
.pitch{flex:1 1 auto;display:grid;grid-template-columns:1fr;grid-template-rows:1fr auto 1fr;border:2px solid rgba(198,244,50,.45);border-radius:14px;background:var(--pitch)}
.half{padding:6px 8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.hh{display:flex;justify-content:space-between;align-items:baseline}
.hh .t{font-size:12px;font-weight:800;letter-spacing:.1em}
.hh .a{font-size:20px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.ta .t,.ta .a{color:var(--volt)}.tb .t,.tb .a{color:var(--blue)}
.grid{flex:1 1 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(38px,1fr);gap:5px}
.mid{display:flex;align-items:center;gap:10px;padding:0 8px}
.mid span.l{flex:1;height:2px;background:rgba(198,244,50,.45)}
.mid .p{font-size:12px;font-weight:700;background:var(--bg);border:1.5px solid rgba(198,244,50,.6);border-radius:999px;padding:2px 10px;white-space:nowrap}
.chip{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;min-width:0;padding:2px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);text-align:left}
.ta .chip{border-color:var(--volt)}.tb .chip{border-color:var(--blue)}
.chip .n{font-size:14px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .r{font-size:11px;font-weight:600;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.g{border-style:dashed}
.chip.sel{background:var(--volt);color:var(--bg)}.chip.sel .r{color:var(--bg)}
.chip.ca{background:#1B3A2E;border-color:var(--volt)}.chip.cb{background:#1B3262;border-color:var(--blue)}
.chip:disabled{cursor:default}
.pickbox{flex:1 1 auto;border:2px solid rgba(198,244,50,.45);border-radius:14px;background:var(--pitch);padding:8px;display:flex;flex-direction:column}
.btns{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px}
.row .btn{flex:1}
.btn{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);font-size:16px;font-weight:700;padding:0 14px}
.btn.pri{border:none;background:var(--volt);color:var(--bg);font-size:17px;font-weight:800;min-height:48px;border-radius:14px}
.btn.off{background:var(--dim);color:#8FA2C4;border:none;cursor:default}
.btn:focus-visible,.chip:focus-visible{outline:3px solid #fff;outline-offset:2px}
#score{flex:0 0 auto;margin-top:auto}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:1fr auto;grid-template-areas:"a b" "e e";gap:6px}
.opt{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 6px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);text-align:center}
.opt.oa{grid-area:a}.opt.ob{grid-area:b}.opt.oe{grid-area:e;min-height:44px}
.opt b{font-size:15px;font-weight:800}
.opt span{max-width:100%;font-size:12px;font-weight:600;color:var(--mut);line-height:1.25}
.opt span span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt.oa{border-color:var(--volt)}.opt.ob{border-color:var(--blue)}
.opt.on{background:var(--volt);border-color:var(--volt);color:var(--bg)}.opt.ob.on{background:var(--blue);border-color:var(--blue)}.opt.on span{color:var(--bg)}
.step{margin-top:6px}
.step p{margin:0 0 4px;font-size:12px;font-weight:700;color:#D3DDF0}
.nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.num{min-height:40px;padding:0;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.num.on{background:var(--volt);border-color:var(--volt);color:var(--bg)}
.num:focus-visible{outline:3px solid #fff;outline-offset:2px}
.opt:focus-visible{outline:3px solid #fff;outline-offset:2px}
[hidden]{display:none!important}
/* telefon înalt: ecranul de scor rămâne compact, dar cu butoane mai mari */
@media (min-height:640px) and (max-width:819px){
  .opt{padding:12px 6px}
  .opt b{font-size:16px}
  .opt span{font-size:14px}
  .opt.oe{min-height:52px}
  .num{min-height:50px;font-size:19px}
}
/* ecran mic pe înălțime: nota lângă nume, ca să rămână tot pe un ecran */
@media (max-height:480px){
  .chip{flex-direction:row;align-items:center;justify-content:space-between;gap:5px;padding:2px 6px}
  .chip .n{flex:0 0 auto;max-width:72%;font-size:13px}
  .chip .r{flex:0 1 auto;min-width:0;font-size:10px}
  .grid{grid-auto-rows:minmax(32px,1fr)}
  .num{min-height:36px}
  .opt{padding:3px 6px}
  .step{margin-top:3px}
  .step p{margin-bottom:2px}
  .btns{flex-direction:row}
  .btns .row{flex:2 1 0}
  .btn,.btn.pri{font-size:14px;padding:0 6px;line-height:1.1;min-height:44px;border-radius:12px}
  .btn.pri{flex:1 1 0}
}
/* calculator și telefon pe orizontală: echipele una lângă alta, butoanele pe un rând */
@media (min-width:820px),(orientation:landscape) and (min-width:560px){
  .pitch{grid-template-columns:1fr auto 1fr;grid-template-rows:none}
  .mid{flex-direction:column;padding:8px 0}
  .mid span.l{width:2px;height:auto;flex:1}
  .mid .p{white-space:normal;text-align:center;max-width:90px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  #gridP{grid-template-columns:repeat(4,minmax(0,1fr))}
  .opts{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:1fr;grid-template-areas:"a e b"}
  .opt.oe{padding:4px 18px}
  .nums{grid-template-columns:repeat(10,minmax(0,1fr))}
  .btns{flex-direction:row}
  .btns .row{flex:2 1 0}
  .btn.pri{flex:1 1 0;min-height:44px}
}
@media (min-width:820px){
  .wrap{max-height:860px;padding:16px 14px;gap:10px}
  #score{margin-top:0}
  .btns{margin-top:auto}
  #app{gap:10px}
  h1{font-size:26px}
  .meta,.status{font-size:14px}
  .half{padding:14px;gap:10px}
  .hh .a{font-size:26px}
  .grid{gap:10px}
  .chip{padding:4px 12px}
  .chip .n{font-size:16px}.chip .r{font-size:13px}
  .btn,.btn.pri{min-height:52px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <h1>Echipe<span style="color:var(--volt)">Ai</span></h1>
    <div class="meta"><span id="when"></span><span id="cnt"></span></div>
  </div>
  <div class="test" id="test"></div>
  <div class="status" role="status" aria-live="polite"><i></i><span id="msg">Se încarcă datele…</span></div>

  <div class="card" id="block" hidden></div>

  <section id="app" hidden>
    <div class="pitch" id="pitch">
      <div class="half ta">
        <div class="hh"><span class="t">ECHIPA A</span><span class="a" id="avgA">–</span></div>
        <div class="grid" id="gridA"></div>
      </div>
      <div class="mid"><span class="l"></span><span class="p" id="diff">Diferență –</span><span class="l"></span></div>
      <div class="half tb">
        <div class="hh"><span class="t">ECHIPA B</span><span class="a" id="avgB">–</span></div>
        <div class="grid" id="gridB"></div>
      </div>
    </div>
    <div class="pickbox" id="pick" hidden>
      <div class="grid" id="gridP"></div>
    </div>
    <div class="pickbox" id="score" hidden>
      <div class="opts">
        <button class="opt oa" type="button" data-res="A"><b>A a câștigat</b><span id="lsA"></span></button>
        <button class="opt oe" type="button" data-res="E"><b>Egal</b></button>
        <button class="opt ob" type="button" data-res="B"><b>B a câștigat</b><span id="lsB"></span></button>
      </div>
      <div class="step" id="step">
        <p>Diferență de goluri</p>
        <div class="nums" id="nums"><button class="num" type="button" data-n="1">1</button><button class="num" type="button" data-n="2">2</button><button class="num" type="button" data-n="3">3</button><button class="num" type="button" data-n="4">4</button><button class="num" type="button" data-n="5">5</button><button class="num" type="button" data-n="6">6</button><button class="num" type="button" data-n="7">7</button><button class="num" type="button" data-n="8">8</button><button class="num" type="button" data-n="9">9</button><button class="num" type="button" data-n="10">10+</button></div>
      </div>
    </div>
    <div class="btns">
      <div class="row" id="rowGen">
        <button class="btn" id="bGen" type="button">Generează</button>
        <button class="btn" id="bCap" type="button">Alege căpitanii</button>
      </div>
      <div class="row" id="rowUnlock" hidden>
        <button class="btn" id="bUnlock" type="button">Deblochează</button>
        <button class="btn" id="bScore" type="button">Pune scorul</button>
      </div>
      <button class="btn pri" id="bPri" type="button">Blochează echipele</button>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";
  var LIVE_SHEET = "1qZwefpegumzPD9McRsfmnqfDgDzyUzwJKEQi65y3i3g";
  var EMB = "v1.rxHXcoB3VoRK2WxG7WIrkw==.XKeg+1IaNszcKx88.fdFNMPuAzmM81wbbP7bd35KheZSJcdvZwQ==", RX = /^v1\.[A-Za-z0-9+\/=]+\.[A-Za-z0-9+\/=]+\.[A-Za-z0-9+\/=]+$/;
  function norm(x) { return String(x || "").trim().toLowerCase(); }
  function ub(x) { return Uint8Array.from(atob(x), function (c) { return c.charCodeAt(0); }); }
  /* parola e verificată pe un bloc criptat (AES-GCM); blocul poate fi înlocuit din fila "admin" a sheet-ului, rândul care începe cu "blk" */
  function openBlock(blk, pw) {
    var p = blk.split("."); if (p[0] !== "v1" || p.length !== 4 || !pw || !window.crypto || !crypto.subtle) return Promise.resolve(false);
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (m) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: ub(p[1]), iterations: 200000, hash: "SHA-256" }, m, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    }).then(function (k) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: ub(p[2]) }, k, ub(p[3])); })
      .then(function (t) { return new TextDecoder().decode(t) === "echipe-ok"; }, function () { return false; });
  }
  var BLK = null;
  function getBlock() {
    if (BLK) return Promise.resolve(BLK);
    var tmo = new Promise(function (ok) { setTimeout(function () { ok(null); }, 3500); });
    return Promise.race([gviz("admin").then(function (rows) { var r = rows.filter(function (x) { return x[0] === "blk"; })[0]; return r && RX.test(String(r[1]).trim()) ? String(r[1]).trim() : null; }, function () { return null; }), tmo]).then(function (b) { return (BLK = b || EMB); });
  }
  var MIN_VOTES = 3;
  var qs = new URLSearchParams(location.search);
  var TEST = qs.get("test") === "1";
  var $ = function (id) { return document.getElementById(id); };
  /* ids: identificatori unici; R: nota (null la invitați și la cei fără destule voturi); SN: nume afișat; G: invitat (cu "adus de") */
  var S = { ids: [], R: {}, SN: {}, FN: {}, G: {}, A: [], B: [], sel: null, busy: false, locked: false, view: "teams", cA: null, cB: null, pA: null, pB: null, dateLabel: "", res: null, diff: null, sent: false, wed: "" };

  /* echipele blocate rămân pe telefon, ca după meci să se poată pune scorul; se păstrează până marțea dinaintea meciului următor */
  var SK = "fm_echipe" + (TEST ? "_test" : "");
  function save() {
    try { localStorage.setItem(SK, JSON.stringify({ wed: S.wed, ids: S.ids, R: S.R, SN: S.SN, FN: S.FN, G: S.G, A: S.A, B: S.B, cA: S.cA, cB: S.cB, dateLabel: S.dateLabel, res: S.res, diff: S.diff, sent: S.sent })); } catch (e) {}
  }
  function clearSaved() { try { localStorage.removeItem(SK); } catch (e) {} }
  function loadSaved(wed) {
    try {
      var d = JSON.parse(localStorage.getItem(SK) || "null");
      if (!d || !d.ids || !d.A || !d.B) return null;
      if (TEST) return d.sent ? null : d;
      if (d.wed === wed) return d;
      var today = new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Bucharest" });
      return !d.sent && d.wed < wed && (new Date(today) - new Date(d.wed)) / 864e5 <= 6 ? d : null;
    } catch (e) { return null; }
  }
  function restore(d) {
    Object.keys(d).forEach(function (k) { S[k] = d[k]; });
    S.locked = true; S.view = "teams"; S.sel = null;
    $("when").textContent = d.dateLabel.slice(0, -5);
    $("cnt").textContent = " · " + d.ids.length + " jucători";
    if (TEST) { $("test").textContent = "TEST: echipe salvate pe acest telefon."; $("test").style.display = "block"; }
    setMsg(scoreReady() ? "Scor: " + scoreLabel() + "." : "Echipe blocate. Le poți trimite.");
    $("block").hidden = true; $("app").hidden = false; wire(); render();
  }
  function scoreLabel() { return S.res === "E" ? "Egal" : S.res + " +" + S.diff; }
  /* scorul e complet doar cu rezultat și, la victorie, cu diferența aleasă */
  function scoreReady() { return S.res === "E" || ((S.res === "A" || S.res === "B") && !!S.diff); }
  function scoreMsg() { return scoreReady() ? "Scor: " + scoreLabel() + "." : (S.res ? "Alege diferența de goluri." : "Alege rezultatul, apoi trimite."); }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]; }); }
  function fmt(x, d) { return x == null ? "–" : x.toFixed(d).replace(".", ","); }
  function setMsg(t) { $("msg").textContent = t; }
  function showBlock(title, text) { $("block").innerHTML = "<b>" + esc(title) + "</b>" + esc(text); $("block").hidden = false; $("app").hidden = true; }

  /* citire live din sheet-ul public (JSONP, ca pe site) */
  function gviz(sheet) {
    return new Promise(function (ok, no) {
      var cb = "__fe" + Date.now() + Math.floor(Math.random() * 1e6), sc = document.createElement("script");
      var t = setTimeout(function () { delete window[cb]; sc.remove(); no(new Error("timeout")); }, 8000);
      window[cb] = function (res) {
        clearTimeout(t); delete window[cb]; sc.remove();
        try {
          if (res.status === "error") throw new Error("sheet");
          ok(res.table.rows.map(function (r) { return (r.c || []).map(function (c) { return c == null || c.v == null ? "" : String(c.v).replace(/^~/, ""); }); }));
        } catch (e) { no(e); }
      };
      sc.onerror = function () { clearTimeout(t); delete window[cb]; no(new Error("net")); };
      sc.src = "https://docs.google.com/spreadsheets/d/" + LIVE_SHEET + "/gviz/tq?tqx=responseHandler:" + cb + "&headers=0&sheet=" + encodeURIComponent(sheet) + "&_=" + Date.now();
      document.head.appendChild(sc);
    });
  }

  /* miercurea țintă: azi dacă e miercuri, altfel următoarea (ora României) */
  function targetWed() {
    var iso = new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Bucharest" });
    var p = iso.split("-").map(Number), d = new Date(p[0], p[1] - 1, p[2]);
    d.setDate(d.getDate() + ((3 - d.getDay() + 7) % 7));
    var z = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
  }
  function dmy(iso) { return iso.slice(8) + "." + iso.slice(5, 7) + "." + iso.slice(0, 4); }

  function shortNames(names) {
    var o = {}, cnt = {};
    names.forEach(function (n) { var m = n.match(/\(([^)]+)\)/); o[n] = m ? m[1] : n.split(" ")[0]; });
    Object.keys(o).forEach(function (k) { cnt[o[k]] = (cnt[o[k]] || 0) + 1; });
    names.forEach(function (n) { if (cnt[o[n]] > 1 && !/\(/.test(n)) { var p = n.split(" "); if (p[1]) o[n] = p[0] + " " + p[1][0] + "."; } });
    return o;
  }

  function shuf(a) { var x = a.slice(); for (var i = x.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = x[i]; x[i] = x[j]; x[j] = t; } return x; }
  function sizeA() { return Math.ceil(S.ids.length / 2); }
  function avgOf(list) {
    var s = 0, c = 0;
    list.forEach(function (i) { if (S.R[i] != null) { s += S.R[i]; c++; } });
    return c ? s / c : null;
  }

  /* împărțire echilibrată: cei fără notă (invitați etc.) se pun la întâmplare, ceilalți se echilibrează */
  function solve(ca, cb) {
    var ids = S.ids, R = S.R, n = ids.length, sa = sizeA(), sb = n - sa;
    var fA = ca ? [ca] : [], fB = cb ? [cb] : [], swapSides = false;
    var rest = ids.filter(function (i) { return fA.indexOf(i) < 0 && fB.indexOf(i) < 0; });
    if (!ca && !cb) {
      var first = rest.filter(function (i) { return R[i] != null; })[0] || rest[0];
      fA = [first]; swapSides = n % 2 === 0 && Math.random() < 0.5;
      rest = rest.filter(function (i) { return i !== first; });
    }
    var needA = sa - fA.length, needB = sb - fB.length;
    var U = shuf(rest.filter(function (i) { return R[i] == null; }));
    var Rr = rest.filter(function (i) { return R[i] != null; });
    var u = U.length, ua = Math.floor(u / 2) + (u % 2 && Math.random() < 0.5 ? 1 : 0);
    ua = Math.max(u - needB, Math.min(needA, ua));
    var ra = needA - ua, m = Rr.length, res = [];
    var allRated = ids.filter(function (i) { return R[i] != null; });
    var gm = allRated.reduce(function (s, i) { return s + R[i]; }, 0) / (allRated.length || 1);
    var baseA = fA.filter(function (i) { return R[i] != null; }), baseB = fB.filter(function (i) { return R[i] != null; });
    var sumA0 = baseA.reduce(function (s, i) { return s + R[i]; }, 0), sumB0 = baseB.reduce(function (s, i) { return s + R[i]; }, 0);
    var tot = Rr.reduce(function (s, i) { return s + R[i]; }, 0);
    for (var mask = 0; mask < (1 << m); mask++) {
      var c = 0, s = 0;
      for (var j = 0; j < m; j++) if (mask & (1 << j)) { c++; s += R[Rr[j]]; }
      if (c !== ra) continue;
      var cntA = baseA.length + c, cntB = baseB.length + (m - c);
      var aA = cntA ? (sumA0 + s) / cntA : gm, aB = cntB ? (sumB0 + tot - s) / cntB : gm;
      res.push({ mask: mask, d: Math.abs(aA - aB) });
    }
    res.sort(function (x, y) { return x.d - y.d; });
    var lim = res[0].d + 0.1, pool = res.filter(function (x) { return x.d <= lim; }).slice(0, 12);
    var pick = pool[Math.floor(Math.random() * pool.length)];
    var A = fA.concat(U.slice(0, ua)), B = fB.concat(U.slice(ua));
    Rr.forEach(function (id, j) { if (pick.mask & (1 << j)) A.push(id); else B.push(id); });
    return swapSides ? { A: B, B: A } : { A: A, B: B };
  }

  function shuffled(ca, cb) {
    var sa = sizeA();
    if (ca) {
      var o = shuf(S.ids.filter(function (i) { return i !== ca && i !== cb; }));
      return { A: [ca].concat(o.slice(0, sa - 1)), B: [cb].concat(o.slice(sa - 1)) };
    }
    var p = shuf(S.ids);
    return { A: p.slice(0, sa), B: p.slice(sa) };
  }

  function sub(id) {
    var g = S.G[id];
    if (g) return "invitat" + (g.by ? " · " + g.by : "");
    return fmt(S.R[id], 1);
  }
  function chipHtml(id, cls, subtxt, dis) {
    return "<button type=\"button\" class=\"chip" + (S.G[id] ? " g" : "") + cls + "\" data-id=\"" + esc(id) + "\"" + (dis ? " disabled" : "") + "><span class=\"n\">" + esc(S.SN[id]) + "</span><span class=\"r\">" + esc(subtxt) + "</span></button>";
  }

  function render() {
    var pick = S.view === "pick", score = S.view === "score";
    $("pitch").hidden = pick || score; $("pick").hidden = !pick; $("score").hidden = !score;
    if (score) {
      var ls = function (l) { return l.map(function (i) { return "<span>" + esc(S.SN[i]) + "</span>"; }).join(""); };
      $("lsA").innerHTML = ls(S.A); $("lsB").innerHTML = ls(S.B);
      [].forEach.call(document.querySelectorAll(".opt"), function (o) { o.classList.toggle("on", o.getAttribute("data-res") === S.res); });
      $("step").style.visibility = S.res === "A" || S.res === "B" ? "visible" : "hidden";
      [].forEach.call(document.querySelectorAll(".num"), function (o) { o.classList.toggle("on", Number(o.getAttribute("data-n")) === S.diff); });
    }
    if (pick) {
      $("gridP").innerHTML = S.ids.map(function (id) {
        var a = S.pA === id, b = S.pB === id;
        return chipHtml(id, a ? " ca" : (b ? " cb" : ""), a ? "Căpitan A" : (b ? "Căpitan B" : sub(id)), false);
      }).join("");
    } else {
      var one = function (list) {
        return list.map(function (id) {
          var cap = id === S.cA || id === S.cB;
          return chipHtml(id, S.sel === id ? " sel" : "", (cap ? "Căpitan · " : "") + sub(id), S.locked || S.busy);
        }).join("");
      };
      $("gridA").innerHTML = one(S.A); $("gridB").innerHTML = one(S.B);
      var a = avgOf(S.A), b = avgOf(S.B);
      $("avgA").textContent = fmt(a, 2); $("avgB").textContent = fmt(b, 2);
      $("diff").textContent = "Diferență " + (a != null && b != null ? fmt(Math.abs(a - b), 2) : "–");
    }
    $("rowGen").hidden = S.locked;
    $("rowUnlock").hidden = !S.locked;
    $("bUnlock").hidden = score;
    $("bScore").textContent = score ? "Înapoi" : (scoreReady() ? "Schimbă scorul" : "Pune scorul");
    $("bGen").hidden = pick; $("bCap").textContent = pick ? "Înapoi" : "Alege căpitanii";
    var pri = $("bPri"), off = false;
    if (S.busy) { pri.textContent = "Se amestecă…"; off = true; }
    else if (pick) { pri.textContent = "Completează echipele"; off = !(S.pA && S.pB); }
    else if (score) { pri.textContent = "Trimite cu scorul"; off = !scoreReady(); }
    else if (S.locked) pri.textContent = scoreReady() ? "Trimite cu scorul" : "Trimite echipele";
    else pri.textContent = "Blochează echipele";
    pri.className = "btn pri" + (off ? " off" : "");
    pri.setAttribute("aria-disabled", off ? "true" : "false");
  }

  function run(ca, cb) {
    if (S.busy) return;
    var fin = solve(ca, cb), step = 0, total = 14;
    S.busy = true; S.view = "teams"; S.sel = null; S.cA = ca || null; S.cB = cb || null;
    var tick = function () {
      if (step >= total) { S.A = fin.A; S.B = fin.B; S.busy = false; setMsg("Calculate după voturi. Schimbă apăsând pe doi jucători."); render(); return; }
      var s = shuffled(ca, cb); S.A = s.A; S.B = s.B;
      setMsg(step < 7 ? "Se amestecă…" : "Se echilibrează notele…");
      render(); step++; setTimeout(tick, 70 + step * 14);
    };
    tick();
  }

  function fullName(id) { return S.G[id] ? S.FN[id] + " (invitat)" : id; }
  function names(l) { return l.map(function (i) { return fullName(i) + (i === S.cA || i === S.cB ? " (C)" : ""); }).join(", "); }
  function shareText(withScore) {
    return S.dateLabel + (TEST ? " (TEST)" : "") + " | Echipe finale | Mod: " + (S.cA ? "căpitani" : "automat") + "\nA: " + names(S.A) + "\nB: " + names(S.B) + (withScore ? "\nScor: " + scoreLabel() : "");
  }
  function send(withScore) {
    var t = shareText(withScore);
    var done = function () { if (withScore) { S.sent = true; save(); S.view = "teams"; setMsg("Trimis cu scorul: " + scoreLabel() + "."); render(); } };
    var fb = function () {
      try { navigator.clipboard.writeText(t); setMsg("Copiat. Lipește-l în chat."); if (withScore) { S.sent = true; save(); } }
      catch (e) { window.prompt("Copiază textul:", t); }
    };
    try { if (navigator.share) navigator.share({ text: t }).then(done).catch(function () {}); else fb(); } catch (e) { fb(); }
  }

  function onChip(id) {
    if (S.busy) return;
    if (S.view === "pick") {
      if (S.pA === id) S.pA = null; else if (S.pB === id) S.pB = null; else if (!S.pA) S.pA = id; else if (!S.pB) S.pB = id;
      setMsg(S.pA && S.pB ? "Restul se completează după note. Apasă Completează." : "Primul ales e căpitan A, al doilea căpitan B.");
      render(); return;
    }
    if (S.locked) return;
    if (!S.sel || S.sel === id) { S.sel = S.sel === id ? null : id; render(); return; }
    var inA = function (x) { return S.A.indexOf(x) >= 0; };
    if (inA(S.sel) === inA(id)) { S.sel = id; render(); return; }
    var a = S.sel, sw = function (arr) { return arr.map(function (x) { return x === a ? id : (x === id ? a : x); }); };
    S.A = sw(S.A); S.B = sw(S.B); S.sel = null;
    setMsg(S.SN[a] + " ↔ " + S.SN[id] + " schimbați.");
    render();
  }

  function wire() {
    $("app").addEventListener("click", function (e) {
      var b = e.target.closest(".chip"); if (b) onChip(b.getAttribute("data-id"));
      var o = e.target.closest(".opt");
      if (o) { S.res = o.getAttribute("data-res"); S.sent = false; save(); setMsg(scoreMsg()); render(); }
      var u = e.target.closest(".num");
      if (u) { S.diff = Number(u.getAttribute("data-n")); S.sent = false; save(); setMsg(scoreMsg()); render(); }
    });
    $("bGen").addEventListener("click", function () { if (!S.busy && !S.locked) run(null, null); });
    $("bCap").addEventListener("click", function () {
      if (S.busy || S.locked) return;
      if (S.view === "pick") { S.view = "teams"; setMsg("Calculate după voturi. Schimbă apăsând pe doi jucători."); }
      else { S.view = "pick"; S.pA = null; S.pB = null; S.sel = null; setMsg("Primul ales e căpitan A, al doilea căpitan B."); }
      render();
    });
    $("bScore").addEventListener("click", function () {
      S.view = S.view === "score" ? "teams" : "score";
      setMsg(S.view === "score" ? scoreMsg() : (scoreReady() ? "Scor: " + scoreLabel() + "." : "Echipe blocate. Le poți trimite."));
      render();
    });
    $("bUnlock").addEventListener("click", function () { S.locked = false; S.res = null; S.diff = null; S.sent = false; clearSaved(); setMsg("Deblocat. Poți schimba echipele."); render(); });
    $("bPri").addEventListener("click", function () {
      if (S.busy) return;
      if (S.view === "pick") { if (S.pA && S.pB) run(S.pA, S.pB); return; }
      if (S.view === "score") { if (scoreReady()) send(true); return; }
      if (S.locked) { send(scoreReady()); return; }
      S.locked = true; S.sel = null; save(); setMsg("Echipe blocate. Le poți trimite."); render();
    });
  }

  /* members: [nume]; guests: [{name, by}] */
  function start(members, guests, R, label, testNote) {
    var n = members.length + guests.length;
    if (n < 6) { showBlock("Prea puțini jucători", "Lista are " + n + " jucători, minimum 6."); return; }
    if (n > 14) { showBlock("Prea mulți jucători", "Lista are " + n + " jucători, maximum 14."); return; }
    var sn = shortNames(members);
    S.ids = []; S.R = {}; S.SN = {}; S.FN = {}; S.G = {};
    members.forEach(function (m) { S.ids.push(m); S.R[m] = R[m] != null ? R[m] : null; S.SN[m] = sn[m]; });
    guests.forEach(function (g, i) { var id = "inv" + (i + 1) + ":" + g.name; S.ids.push(id); S.R[id] = null; S.SN[id] = g.name; S.FN[id] = g.name; S.G[id] = { by: g.by || "" }; });
    S.dateLabel = label;
    var f = solve(null, null); S.A = f.A; S.B = f.B;
    $("cnt").textContent = " · " + n + " jucători";
    if (testNote) { $("test").textContent = testNote; $("test").style.display = "block"; }
    setMsg("Calculate după voturi. Schimbă apăsând pe doi jucători.");
    $("block").hidden = true; $("app").hidden = false; wire(); render();
  }

  function ratingsFrom(rows) {
    var R = {};
    rows.slice(1).forEach(function (r) {
      var nm = (r[0] || "").trim(); if (!nm) return;
      var v = r.slice(2, 7).map(function (x) { return parseFloat(String(x).replace(",", ".")); });
      var votes = parseInt(r[1], 10) || 0;
      if (votes >= MIN_VOTES && v.every(function (x) { return x > 0; })) R[nm] = v.reduce(function (a, b) { return a + b; }, 0) / 5;
    });
    return R;
  }

  function boot() {
    var saved = ""; try { saved = localStorage.getItem("fm_k") || ""; } catch (e) {}
    var given = norm(qs.get("k") || saved);
    getBlock().then(function (blk) { return given ? openBlock(blk, given) : false; }).then(function (ok) {
      if (ok) { try { localStorage.setItem("fm_k", given); } catch (e) {} return bootOk(); }
      try { localStorage.removeItem("fm_k"); } catch (e) {}
      setMsg("Acces restricționat.");
      showBlock("Acces doar pentru admini", "Scrie parola de admin. O cere o singură dată, apoi o ține minte pe acest telefon.");
      $("block").insertAdjacentHTML("beforeend", "<form id=\"gate\" style=\"display:flex;gap:8px;margin-top:12px\"><input id=\"code\" type=\"password\" autocomplete=\"off\" autocapitalize=\"none\" aria-label=\"Parola admin\" placeholder=\"Parola\" style=\"flex:1;min-width:0;height:48px;border-radius:10px;border:1.5px solid #3A5086;background:#0A1630;color:#F2F5FA;font-size:16px;padding:0 12px\"><button class=\"btn\" type=\"submit\" style=\"flex:0 0 auto\">Intră</button></form><div id=\"gerr\" style=\"margin-top:8px;color:#FFB4B4;font-size:14px\" role=\"alert\"></div>");
      $("gate").addEventListener("submit", function (e) {
        e.preventDefault();
        var pw = norm($("code").value);
        getBlock().then(function (blk) { return openBlock(blk, pw); }).then(function (ok) {
          if (ok) { try { localStorage.setItem("fm_k", pw); } catch (x) {} location.reload(); }
          else { $("gerr").textContent = "Parolă greșită."; }
        });
      });
    });
  }

  function bootOk() {
    var wed = targetWed(), saved = loadSaved(wed);
    if (saved) { restore(saved); return; }
    S.wed = wed;
    $("when").textContent = "Miercuri " + dmy(wed).slice(0, 5);
    Promise.all([gviz("hexagon"), TEST ? gviz("date") : gviz("echipe").catch(function () { return []; })]).then(function (out) {
      var R = ratingsFrom(out[0]), rows = out[1];
      if (TEST) {
        var wk = rows.filter(function (r) { return r[0] === "wk"; })[0], st = rows.filter(function (r) { return r[0] === "st"; })[0], last = -1;
        for (var i = 2; wk && i < wk.length; i++) if (st && st[i] === "Jucat") last = i;
        if (last < 0) { showBlock("Fără date", "Nu am găsit nicio miercuri jucată."); return; }
        var d = wk[last]; S.wed = d; var dm = d.slice(8) + "." + d.slice(5, 7);
        var gs = rows.filter(function (r) { return r[0] === "g" && r[2] === d; });
        var pl = rows.filter(function (r) { return r[0] === "m" && (r[last] === "J" || r[last] === "J+"); }).map(function (r) { return r[1]; });
        pl = pl.slice(0, Math.max(0, 12 - gs.length));
        var gl = gs.map(function (r, k) { return { name: "Invitat " + (k + 1), by: r[1] }; });
        $("when").textContent = "Test " + dm;
        start(pl, gl, R, "Miercuri " + dmy(d), "TEST: lista din " + dm + ", nu cea de miercuri.");
        return;
      }
      var mine = rows.filter(function (r) { return (r[0] || "") === wed && (r[1] || "").trim(); });
      if (!mine.length) { setMsg("Prezența nu e încărcată."); showBlock("Sese nu a încărcat prezența", "Echipele se deblochează după ce Sese încarcă lista pentru miercuri " + dmy(wed).slice(0, 5) + "."); return; }
      var mem = [], gst = [];
      mine.forEach(function (r) { var nm = r[1].trim(); if (/^i/i.test((r[2] || "").trim())) gst.push({ name: nm, by: (r[3] || "").trim() }); else mem.push(nm); });
      start(mem, gst, R, "Miercuri " + dmy(wed), "");
    }).catch(function () {
      setMsg("Nu s-au putut citi datele."); showBlock("Nu s-au putut citi datele", "Verifică conexiunea și reîncarcă pagina.");
    });
  }
  boot();
})();
</script>
